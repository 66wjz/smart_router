# Smart Router 配置模板（脱敏示例）
# 复制为 config.yaml 后填写真实值；config.yaml 已被 .gitignore 忽略，绝不入库
# 修改后调用 POST /admin/api/reload 热重载，或重启服务

# ========== 路由层 API Key ==========
# 客户端请求时必须携带此处的某个 Key，校验通过后才进行路由
# groups: 该 Key 可访问的分组列表，默认 ["free"]
api_keys:
  - name: "默认 Key"
    key: "sk-YOUR-DEFAULT-KEY"
    groups: ["free"]
    enabled: true
  - name: "我的专属 Key"
    key: "sk-YOUR-PREMIUM-KEY"
    groups: ["free", "premium"]
    enabled: true

# ========== 上游源 ==========
# group: 该上游所属分组，客户端 Key 的 groups 必须包含此值才能访问
# probe_enabled: 是否参与延迟探测（付费稳定源可设为 false 省请求）
upstreams:
  - id: "your-upstream"
    name: "你的上游源"
    base_url: "https://api.your-provider.com"
    api_key: "sk-YOUR-UPSTREAM-KEY"
    format: "openai"
    group: "free"
    probe_enabled: true

# 默认上游源（直接透传模型名时使用）
default_upstream: "your-upstream"

# ========== 代理服务 ==========
listen_port: 10002

# ========== 管理后台 ==========
admin:
  username: "admin"
  password: "CHANGE-ME-STRONG-PASSWORD"
  session_hours: 24

# ========== 路由规则 ==========
# 基于上游拉取的可用模型配置
# P1: 主力高权重，P2: 备选，P3: 降级兜底
rules:
  - name: "视觉理解"
    match:
      has_image: true
    candidates:
      - model: "your-vision-model"
        upstream: "your-upstream"
        weight: 5
        priority: 1
        max_context: 1000000
        max_output: 32768

  - name: "工具调用"
    match:
      has_tools: true
    candidates:
      - model: "your-tool-model"
        upstream: "your-upstream"
        weight: 5
        priority: 1
        max_context: 1000000
        max_output: 65536

  - name: "默认对话"
    match:
      default: true
    candidates:
      - model: "your-chat-model"
        upstream: "your-upstream"
        weight: 5
        priority: 1
        max_context: 1000000
        max_output: 65536

# ========== 模型别名（指针） ==========
model_pointers:
  - name: "my-model"
    target_model: "your-chat-model"
    upstream: "your-upstream"

# ========== 统一模型名映射 ==========
aggregated_model_names:
  - "smart-latest"
  - "smart-chat"
  - "auto-chat"

# ========== 延迟探测 ==========
latency_probe:
  enabled: true
  interval_seconds: 120
  timeout_seconds: 35
  request_text: "Hi"
  max_tokens: 3
  base_latency: 0.5
  down_threshold_seconds: 30
  slow_threshold_seconds: 10
  error_as_down: true

# ========== 故障转移 ==========
failover:
  max_fails: 3
  cooldown_seconds: 120

# ========== 请求重试 ==========
retry:
  max_attempts: 3
  response_timeout: 20
  first_chunk_timeout: 8

# ========== 日志 ==========
log_level: "INFO"
log_routing: true
